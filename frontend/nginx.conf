# API routing (/auth, /clients, /workspaces, /pipeline-instances, /webhooks) happens at the Ingress
# level (deploy/04-ingress.yaml), not here - this server only ever sees requests that already didn't
# match one of those path prefixes. SPA fallback so client-side routes (e.g. /specs, /dashboard) don't
# 404 on a hard reload.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
