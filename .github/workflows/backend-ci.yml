name: Backend and Frontend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - 'frontend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/SDLC.Dashboard.csproj
      - name: Build
        run: dotnet build backend/SDLC.Dashboard.csproj --no-restore -c Release
      - name: Test backend
        run: dotnet test backend.Tests/backend.Tests.csproj -c Release
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test and build frontend
        working-directory: frontend
        run: npm install && npm test && npm run build
