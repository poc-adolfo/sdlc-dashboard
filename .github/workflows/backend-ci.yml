name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/SDLC.Dashboard.csproj
      - name: Build
        run: dotnet build backend/SDLC.Dashboard.csproj --no-restore -c Release
